<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aplicação | Mentoria TikTok Billion</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--mute:#9A9A9A;--line:#2B2B2B;--card:#0E0E0E;--red:#FA3441;--red-soft:rgba(250,52,65,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:Montserrat,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}

.progress{position:fixed;top:0;left:0;right:0;height:4px;background:#1A1A1A;z-index:10}
.progress i{display:block;height:100%;width:0;background:var(--red);transition:width .35s ease}

.app{min-height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:40px 24px 32px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.top img{height:34px;width:auto}
.count{font-size:14px;font-weight:600;color:var(--mute)}
.stage{flex:1;display:flex;align-items:center;padding:40px 0}
.screen{width:100%;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Boas-vindas */
.welcome img{width:min(300px,78%);height:auto;margin-bottom:40px}
.welcome h1{font-size:clamp(28px,6vw,38px);font-weight:800;line-height:1.15;letter-spacing:-.01em;margin-bottom:16px}
.welcome p{font-size:17px;line-height:1.6;color:#CFCFCF;max-width:48ch}
.meta{display:flex;gap:18px;margin-top:22px;font-size:14px;color:var(--mute)}
.meta span{display:flex;align-items:center;gap:8px}

.dia{display:inline-block;width:8px;height:8px;background:var(--red);transform:rotate(45deg);flex:none}

/* Pergunta */
.q-title{font-size:clamp(24px,5vw,32px);font-weight:700;line-height:1.25;letter-spacing:-.01em}
.q-help{margin-top:10px;font-size:15px;color:var(--mute);line-height:1.5}
.q-body{margin-top:28px}

.txt{width:100%;background:transparent;border:0;border-bottom:2px solid var(--line);color:var(--fg);font-size:clamp(20px,4.6vw,26px);font-weight:500;padding:10px 0 12px;border-radius:0}
.txt::placeholder{color:#4A4A4A}
.txt:focus{outline:none;border-bottom-color:var(--red)}

.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);color:var(--fg);border-radius:12px;padding:15px 16px;font-size:16px;font-weight:500;line-height:1.35;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:#555}
.key{flex:none;width:28px;height:28px;border:1.5px solid #3A3A3A;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mute)}
.opt .mark{margin-left:auto;opacity:0;transition:opacity .15s}
.opt[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}
.opt[aria-pressed="true"] .key{border-color:var(--red);color:var(--fg);background:var(--red)}
.opt[aria-pressed="true"] .mark{opacity:1}
.other{margin-top:10px}
.other[hidden]{display:none}
.multi-hint{font-size:14px;color:var(--mute);margin-bottom:12px}

.err{min-height:22px;margin-top:14px;font-size:14px;font-weight:600;color:var(--red)}

.actions{display:flex;align-items:center;gap:16px;margin-top:22px}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:17px 30px;font-size:17px;font-weight:700;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:default}
.hint{font-size:13px;color:#6B6B6B}
.hint b{color:var(--mute);font-weight:600}
.back{background:none;border:0;color:var(--mute);font-size:14px;font-weight:600;cursor:pointer;padding:8px 0;margin-top:auto;align-self:flex-start}
.back:hover{color:var(--fg)}
.back[hidden]{visibility:hidden;display:block}

.done h1{font-size:clamp(28px,6vw,36px);font-weight:800;line-height:1.2;margin:18px 0 14px}
.done p{font-size:17px;line-height:1.6;color:#CFCFCF;max-width:46ch}
.done .dia{width:14px;height:14px}

@media (max-width:560px){
  .app{padding:28px 20px 24px}
  .stage{align-items:flex-start;padding:48px 0 24px}
  .btn{width:100%}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.progress i{transition:none}}
</style>
</head>

/* =========================================================
   CLASSIFICAÇÃO DO LEAD (A = prioridade, C = baixa)
   ========================================================= */
function classificar(a){
  const idx = (id, v) => Q.find(q => q.id === id).opts.indexOf(v);
  if (idx("capital", a.capital) === 2 || idx("perfil", a.perfil) === 4 || idx("prazo", a.prazo) === 2) return "C";
  const fat = idx("faturamento", a.faturamento), ver = idx("verba", a.verba);
  if (idx("capital", a.capital) === 0 && (fat >= 2 || ver >= 2)) return "A";
  return "B";
}

let i = -1, sending = false, partialSent = false;
const utms = {};
["utm_source","utm_medium","utm_campaign","utm_content","utm_term"].forEach(k => {
  const qs = new URLSearchParams(location.search);
  let v = qs.get(k);
  try { if (v) sessionStorage.setItem(k, v); else v = sessionStorage.getItem(k); } catch(e){}
  utms[k] = v || "";
});

function first(n){ return (n || "").trim().split(/\s+/)[0] || ""; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const KEYS = "ABCDEFGHIJ";

function render(){
  const s = $("screen");
  s.style.animation = "none"; s.offsetHeight; s.style.animation = "";
  $("toplogo").hidden = i < 0;
  $("back").hidden = i <= 0 || i >= Q.length;
  $("count").textContent = (i >= 0 && i < Q.length) ? (i + 1) + " de " + Q.length : "";
  $("bar").style.width = (i < 0 ? 0 : Math.min(100, (i / Q.length) * 100)) + "%";

  if (i < 0) return renderWelcome(s);
  if (i >= Q.length) return renderDone(s);

  const q = Q[i];
  const title = typeof q.title === "function" ? q.title(answers) : q.title;
  let body = "";

  if (q.type === "text" || q.type === "tel") {
    body = `<input class="txt" id="inp" type="${q.type === "tel" ? "tel" : "text"}" ${q.type === "tel" ? 'inputmode="tel"' : ""}
      placeholder="${esc(q.ph || "")}" autocomplete="${q.ac || "off"}" value="${esc(answers[q.id] || "")}" aria-labelledby="qt">`;
  } else {
    const cur = answers[q.id];
    const sel = v => q.type === "multi" ? (cur || []).includes(v) : cur === v || (q.other && v === q.opts[q.opts.length-1] && cur && !q.opts.includes(cur));
    body = `<div class="opts" role="${q.type === "multi" ? "group" : "radiogroup"}" aria-labelledby="qt">` +
      q.opts.map((o, k) => `<button type="button" class="opt" data-v="${esc(o)}" aria-pressed="${sel(o)}">
        <span class="key">${KEYS[k]}</span><span>${esc(o)}</span><span class="dia mark"></span></button>`).join("") +
      `</div>`;
    if (q.other) {
      const otherVal = cur && !q.opts.includes(cur) ? cur : "";
      body += `<div class="other" id="otherWrap" ${otherVal ? "" : "hidden"}><input class="txt" id="otherInp" placeholder="Qual? Em poucas palavras" value="${esc(otherVal)}"></div>`;
    }
  }

  const needBtn = q.type !== "single" || q.other;
  s.innerHTML = `
    <h2 class="q-title" id="qt">${esc(title)}</h2>
    ${q.help ? `<p class="q-help">${esc(q.help)}</p>` : ""}
    <div class="q-body">${body}</div>
    <p class="err" id="err" role="alert"></p>
    <div class="actions" ${needBtn ? "" : 'style="display:none"'}>
      <button type="button" class="btn" id="ok">${i === Q.length - 1 ? "Enviar aplicação" : "OK"}</button>
      <span class="hint">ou pressione <b>Enter ↵</b></span>
    </div>`;

  const inp = $("inp");
  if (inp) {
    inp.focus();
    if (q.type === "tel") inp.addEventListener("input", maskPhone);
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); next(); } });
  }
  s.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => pick(q, b.dataset.v)));
  const oi = $("otherInp");
  if (oi) oi.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); next(); } });
  if ($("ok")) $("ok").addEventListener("click", next);
}

function renderWelcome(s){
  s.innerHTML = `<div class="welcome">
    <img src="${LOGO}" alt="TikTok Billion">
    <h1>Sua vaga na mentoria começa aqui</h1>
    <p>São perguntas rápidas, quase todas de um clique. Com elas a gente entende seu momento e prepara a call antes de falar com você.</p>
    <div class="meta"><span><i class="dia"></i>${Q.length} perguntas</span><span><i class="dia"></i>Menos de 2 minutos</span></div>
    <div class="actions"><button class="btn" id="start" type="button">Começar aplicação</button>
    <span class="hint">ou pressione <b>Enter ↵</b></span></div>
  </div>`;
  $("start").addEventListener("click", () => { i = 0; render(); });
  $("start").focus();
}

function renderDone(s){
  s.innerHTML = `<div class="done">
    <span class="dia"></span>
    <h1>Aplicação recebida, ${esc(first(answers.nome))}.</h1>
    <p>O time vai analisar suas respostas e, se tiver fit, te chama no WhatsApp pra agendar a call. Fica de olho no número ${esc(answers.whatsapp || "")}.</p>
  </div>`;
}

function pick(q, v){
  if (q.type === "multi") {
    const arr = answers[q.id] || [];
    answers[q.id] = arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
    document.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", answers[q.id].includes(b.dataset.v)));
    $("err").textContent = "";
    return;
  }
  document.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v));
  $("err").textContent = "";
  if (q.other && v === q.opts[q.opts.length-1]) {
    answers[q.id] = v;
    $("otherWrap").hidden = false; $("otherInp").focus();
    return;
  }
  answers[q.id] = v;
  if (q.other) $("otherWrap").hidden = true;
  setTimeout(next, 260);
}

function validate(q){
  if (q.type === "text" || q.type === "tel") {
    const v = $("inp").value.trim();
    if (!v && q.optional) { answers[q.id] = ""; return ""; }
    if (!v) return "Preencha pra continuar.";
    if (q.id === "nome" && v.length < 2) return "Digite seu nome.";
    if (q.type === "tel" && v.replace(/\D/g, "").length < 10) return "Confira o número: DDD + telefone.";
    answers[q.id] = q.id === "instagram" ? "@" + v.replace(/^@+/, "") : v;
    return "";
  }
  if (q.type === "multi") return (answers[q.id] || []).length ? "" : "Marque pelo menos uma opção.";
  if (q.other && answers[q.id] === q.opts[q.opts.length-1]) {
    const o = $("otherInp").value.trim();
    if (!o) return "Escreva o que tá te segurando.";
    answers[q.id] = o;
    return "";
  }
  return answers[q.id] ? "" : "Escolha uma opção.";
}

async function next(){
  if (sending) return;
  const q = Q[i];
  const e = validate(q);
  if (e) { $("err").textContent = e; return; }

  // Salva o contato assim que a pessoa passa do Instagram (pra recuperar quem abandona)
  if (q.id === "instagram" && !partialSent) { partialSent = true; send("parcial"); }

  if (i === Q.length - 1) {
    sending = true;
    const b = $("ok"); b.disabled = true; b.textContent = "Enviando…";
    try { await send("completo"); }
    catch (x) { sending = false; b.disabled = false; b.textContent = "Enviar aplicação"; $("err").textContent = "Não foi possível enviar. Verifique sua conexão e tente de novo."; return; }
    if (CONFIG.REDIRECT_URL) { location.href = CONFIG.REDIRECT_URL; return; }
  }
  i++; render();
}

function send(status){
  const d = new URLSearchParams();
  d.set("lead_id", leadId);
  d.set("status", status);
  Object.entries(answers).forEach(([k, v]) => d.set(k, Array.isArray(v) ? v.join(", ") : v));
  if (status === "completo") d.set("classificacao", classificar(answers));
  Object.entries(utms).forEach(([k, v]) => d.set(k, v));
  d.set("pagina", location.href.split("?")[0]);
  if (!CONFIG.SHEETS_URL || CONFIG.SHEETS_URL.startsWith("COLE_AQUI")) {
    console.warn("SHEETS_URL não configurada. Dados:", Object.fromEntries(d));
    return Promise.resolve();
  }
  return fetch(CONFIG.SHEETS_URL, { method:"POST", mode:"no-cors", body:d });
}

function maskPhone(e){
  let d = e.target.value.replace(/\D/g, "").slice(0, 11);
  e.target.value = d.length > 6 ? "(" + d.slice(0,2) + ") " + d.slice(2, d.length - 4) + "-" + d.slice(-4)
    : d.length > 2 ? "(" + d.slice(0,2) + ") " + d.slice(2) : d;
}

// Teclado: letras escolhem opção, Enter avança
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (i < 0 && e.key === "Enter") { e.preventDefault(); i = 0; render(); return; }
  const q = Q[i]; if (!q || !q.opts) return;
  if (e.key === "Enter") { e.preventDefault(); next(); return; }
  const k = KEYS.indexOf(e.key.toUpperCase());
  if (k > -1 && k < q.opts.length) pick(q, q.opts[k]);
});

$("back").addEventListener("click", () => { if (i > 0) { i--; render(); } });
render();
</script>
</body>
</html>
